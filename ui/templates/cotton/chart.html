<div class="bg-white dark:bg-zinc-900 rounded-xl p-4 sm:p-5 border border-slate-200 dark:border-zinc-800 shadow-sm w-full overflow-hidden {{ class }}">
    {% if title %}
    <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2">
            {% if icon %}
            <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm border border-amber-500/20">
                <i class="{{ icon }}"></i>
            </div>
            {% endif %}
            <div>
                <h3 class="font-bold text-base text-slate-900 dark:text-white tracking-tight">{{ title }}</h3>
                {% if subtitle %}
                <p class="text-xs text-slate-400 dark:text-zinc-500 mt-0.5">{{ subtitle }}</p>
                {% endif %}
            </div>
        </div>
        {% if badge %}
        <span class="text-xs bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 px-2 py-0.5 rounded-full font-medium">{{ badge }}</span>
        {% endif %}
    </div>
    {% endif %}

    <!-- Injected Plotly Div -->
    <div class="w-full">
        {{ figure_html|safe }}
    </div>
</div>
