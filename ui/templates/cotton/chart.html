<div class="bg-theme-surface rounded-xl p-4 sm:p-5 border border-theme-border shadow-sm w-full overflow-hidden {{ class }}">
    {% if title %}
    <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-2">
            {% if icon %}
            <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm border border-amber-500/20">
                <i class="{{ icon }}"></i>
            </div>
            {% endif %}
            <div>
                <h3 class="font-bold text-base text-theme-text tracking-tight">{{ title }}</h3>
                {% if subtitle %}
                <p class="text-xs text-theme-muted mt-0.5">{{ subtitle }}</p>
                {% endif %}
            </div>
        </div>
        {% if badge %}
        <span class="text-xs bg-theme-subtle text-theme-muted border border-theme-border px-2 py-0.5 rounded-full font-medium">{{ badge }}</span>
        {% endif %}
    </div>
    {% endif %}

    <!-- Injected Plotly Div -->
    <div class="w-full">
        {{ figure_html|safe }}
    </div>
</div>
