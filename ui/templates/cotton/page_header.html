<div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
    <div>
        {% if category %}
        <div class="flex items-center space-x-2 text-xs font-semibold uppercase tracking-wider text-slate-400 dark:text-zinc-500 mb-1">
            <span>ForensiQ</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span class="text-sky-600 dark:text-sky-400">{{ category }}</span>
            {% if section %}
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span class="text-slate-700 dark:text-zinc-300">{{ section }}</span>
            {% endif %}
        </div>
        {% endif %}

        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight flex items-center gap-3">
            {% if icon %}
            <i class="{{ icon }} {{ icon_color|default:'text-amber-500' }}"></i>
            {% endif %}
            <span>{{ title }}</span>
        </h1>

        {% if subtitle %}
        <p class="text-slate-500 dark:text-zinc-400 text-sm mt-1 leading-relaxed">
            {{ subtitle }}
        </p>
        {% endif %}
    </div>

    {% if slot %}
    <div class="flex items-center gap-2 flex-wrap">
        {{ slot }}
    </div>
    {% endif %}
</div>
