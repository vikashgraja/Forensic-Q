<div class="bg-white dark:bg-zinc-900 rounded-xl border border-slate-200 dark:border-zinc-800 shadow-sm overflow-hidden {{ class }}">
    {% if title or actions %}
    <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-zinc-800 flex items-center justify-between gap-4">
        <div class="flex items-center space-x-2.5">
            {% if icon %}
            <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-zinc-800 flex items-center justify-center {{ icon_color|default:'text-slate-700 dark:text-zinc-300' }} text-sm">
                <i class="{{ icon }}"></i>
            </div>
            {% endif %}
            <div>
                {% if title %}
                <h3 class="font-bold text-base text-slate-800 dark:text-white tracking-tight">{{ title }}</h3>
                {% endif %}
                {% if subtitle %}
                <p class="text-xs text-slate-400 dark:text-zinc-500 mt-0.5">{{ subtitle }}</p>
                {% endif %}
            </div>
        </div>

        {% if actions %}
        <div class="flex items-center space-x-2">
            {{ actions }}
        </div>
        {% endif %}
    </div>
    {% endif %}

    <div class="p-4 sm:p-5">
        {{ slot }}
    </div>

    {% if footer %}
    <div class="px-4 py-3 bg-slate-50 dark:bg-zinc-950/50 border-t border-slate-100 dark:border-zinc-800 text-xs text-slate-500 dark:text-zinc-400">
        {{ footer }}
    </div>
    {% endif %}
</div>
