{% comment %}
ForensiQ Badge Component (Dark & Light Mode)
Variants: emerald, rose, amber, sky, slate, purple
{% endcomment %}
{% with v=variant|default:"slate" %}
<span class="inline-flex items-center font-medium tracking-tight
    {% if pill|default:True %}rounded-full{% else %}rounded-md{% endif %}
    {% if size == 'lg' %}px-3 py-1 text-sm
    {% elif size == 'sm' %}px-2 py-0.5 text-[11px]
    {% else %}px-2.5 py-0.5 text-xs{% endif %}
    {% if v == 'emerald' %}bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/50
    {% elif v == 'rose' %}bg-rose-50 dark:bg-rose-950/50 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800/50
    {% elif v == 'amber' %}bg-amber-50 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/50
    {% elif v == 'sky' %}bg-sky-50 dark:bg-sky-950/50 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800/50
    {% elif v == 'purple' %}bg-purple-50 dark:bg-purple-950/50 text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-purple-800/50
    {% else %}bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700{% endif %}">
    {% if icon %}
    <i class="{{ icon }} mr-1.5 text-[10px]"></i>
    {% endif %}
    {{ text|default:slot }}
</span>
{% endwith %}
