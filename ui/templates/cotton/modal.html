<div id="{{ id }}" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
    <div class="bg-theme-surface rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-theme-border transform transition-all text-theme-text">
        <div class="flex items-center justify-between border-b border-theme-border pb-4 mb-4">
            <div class="flex items-center space-x-3">
                {% if icon %}
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center text-lg border border-amber-500/20">
                    <i class="{{ icon }}"></i>
                </div>
                {% endif %}
                <div>
                    <h3 class="text-lg font-bold text-theme-text" id="{{ id }}-title">{{ title|default:"Details" }}</h3>
                    {% if subtitle %}
                    <p class="text-xs text-theme-muted" id="{{ id }}-subtitle">{{ subtitle }}</p>
                    {% endif %}
                </div>
            </div>
            <button type="button" data-modal-close="{{ id }}" class="text-theme-muted hover:text-theme-text text-lg p-1.5 rounded-lg hover:bg-theme-subtle transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="space-y-3" id="{{ id }}-body">
            {{ slot }}
        </div>

        {% if footer %}
        <div class="mt-6 pt-4 border-t border-theme-border flex items-center justify-end space-x-3" id="{{ id }}-footer">
            {{ footer }}
        </div>
        {% endif %}
    </div>
</div>
