<div class="bg-white dark:bg-zinc-900 rounded-xl border border-slate-200 dark:border-zinc-800 shadow-sm p-4 mb-6 {{ class }}">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-{{ cols|default:'4' }} gap-3">
        {{ slot }}
    </div>

    {% if summary or actions %}
    <div class="mt-3.5 pt-3 border-t border-slate-100 dark:border-zinc-800 flex items-center justify-between text-xs text-slate-500 dark:text-zinc-400 flex-wrap gap-2">
        <div class="flex items-center space-x-3">
            {{ summary }}
        </div>
        <div class="flex items-center space-x-2">
            {{ actions }}
        </div>
    </div>
    {% endif %}
</div>
