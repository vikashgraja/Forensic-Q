[project]
name = "forensi-q"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vikashgraja", email = "vikashgraja@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "django>=6.1.1",
    "django-cotton>=2.7.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "django-debug-toolbar>=8.0.0",
    "django-upgrade>=1.32.0",
    "djlint>=1.46.2",
    "ruff>=0.16.9",
]
prod = [
    "gunicorn>=26.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".venv",
    "staticfiles",
    "node_modules",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django rules
]
ignore = [
    "E501",  # line length handled by ruff format
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = [".venv", "staticfiles", "node_modules", "tests"]
skips = ["B101"]
