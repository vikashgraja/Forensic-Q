<c-base title="ForensiQ | Forensic Analytics Visualizer">

    <!-- Page Header -->
    <c-page_header 
        title="Analytics Visualizer" 
        subtitle="Cross-entity fund flow visualizer and high-value counterparty distribution."
        icon="fa-solid fa-chart-pie"
        icon_color="text-amber-500"
        category="Q-Trail Analytics"
        section="Executive Analytics">

        <a href="/demo/tabulator/" class="inline-flex items-center px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold shadow-sm transition">
            <i class="fa-solid fa-table-cells mr-2"></i> View Transaction Ledger <i class="fa-solid fa-arrow-right ml-2 text-[10px]"></i>
        </a>
    </c-page_header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Chart Component Container -->
        <c-chart title="Vendor Outflow Distribution" subtitle="Aggregated monthly transfer volumes" icon="fa-solid fa-chart-column" :figure_html="chart_html" />

        <!-- Grid Component Container -->
        <c-data_grid id="test-grid" title="Flagged Transactions" subtitle="High-priority transactions under audit" icon="fa-solid fa-table-list" :columns="table_columns" :data="table_data" />

    </div>

</c-base>
