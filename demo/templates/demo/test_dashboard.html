<c-base title="ForensiQ | Component Sandbox">

    <!-- Page Header -->
    <c-page_header 
        title="Component Sandbox" 
        subtitle="Testing reusable Cotton components for Plotly charts and Tabulator.js tables."
        icon="fa-solid fa-shapes"
        icon_color="text-sky-500"
        category="Design System"
        section="Sandbox">

        <a href="/demo/tabulator/" class="inline-flex items-center px-4 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold shadow-sm transition">
            <i class="fa-solid fa-table-cells mr-2"></i> View Forensic Tabulator Demo <i class="fa-solid fa-arrow-right ml-2 text-[10px]"></i>
        </a>
    </c-page_header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

        <!-- Chart Component Container -->
        <c-chart title="Vendor Outflow Analysis" subtitle="Aggregated monthly transfers" icon="fa-solid fa-chart-column" :figure_html="chart_html" />

        <!-- Grid Component Container -->
        <c-data_grid id="test-grid" title="Flagged Transactions" subtitle="Live Tabulator component" icon="fa-solid fa-table-list" :columns="table_columns" :data="table_data" />

    </div>

</c-base>
