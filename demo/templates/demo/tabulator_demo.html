<c-base title="ForensiQ | Tabulator.js Forensic Showcase">

    <!-- Page Header Component -->
    <c-page_header 
        title="Forensic Transaction Ledger" 
        subtitle="High-performance interactive data grid powered by Tabulator.js with multi-column filtering, custom cell formatters, and export capabilities."
        icon="fa-solid fa-money-bill-transfer"
        icon_color="text-amber-500"
        category="Q-Bank Analytics"
        section="Forensic Engine">

        <button id="btn-export-csv" class="px-3.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 text-slate-700 dark:text-zinc-200 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-zinc-800 transition shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-file-csv text-emerald-600 dark:text-emerald-400"></i> Export CSV
        </button>
        <button id="btn-export-json" class="px-3.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 text-slate-700 dark:text-zinc-200 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-zinc-800 transition shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-file-code text-amber-600 dark:text-amber-400"></i> Export JSON
        </button>
        <button id="btn-print" class="px-3.5 py-2 rounded-lg bg-white dark:bg-zinc-900 border border-slate-300 dark:border-zinc-700 text-slate-700 dark:text-zinc-200 text-xs font-semibold hover:bg-slate-50 dark:hover:bg-zinc-800 transition shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-print text-sky-600 dark:text-sky-400"></i> Print View
        </button>
        <button id="btn-reset-filters" class="px-3.5 py-2 rounded-lg bg-zinc-900 dark:bg-amber-500 text-white dark:text-zinc-950 text-xs font-bold hover:bg-zinc-800 dark:hover:bg-amber-400 transition shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-rotate-left"></i> Reset Filters
        </button>
    </c-page_header>

    <!-- Forensic Metric Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <c-stat_card 
            title="Total Analyzed Txns" 
            :value="total_records" 
            subtitle="<span class='text-sky-600 dark:text-sky-400 font-semibold'>100%</span> ingested records" 
            icon="fa-solid fa-database" 
            variant="sky" />

        <c-stat_card 
            title="Total Inflow (Credits)" 
            value="₹{{ total_inflow|floatformat:0 }}" 
            subtitle="Legitimate & inward wires" 
            icon="fa-solid fa-arrow-down-left" 
            variant="emerald" />

        <c-stat_card 
            title="Total Outflow (Debits)" 
            value="₹{{ total_outflow|floatformat:0 }}" 
            subtitle="Transfers & payouts" 
            icon="fa-solid fa-arrow-up-right" 
            variant="amber" />

        <c-stat_card 
            title="High Risk Alerts" 
            value="{{ high_risk_count }}" 
            extra="({{ escalated_count }} Escalated)"
            subtitle="Requires SAR filing review" 
            icon="fa-solid fa-triangle-exclamation" 
            variant="rose" />
    </div>

    <!-- Filter Bar Component -->
    <c-filter_bar cols="5">
        <!-- Global Search -->
        <div class="lg:col-span-2 relative">
            <label class="block text-xs font-semibold text-slate-600 dark:text-zinc-400 mb-1">Global Live Search</label>
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-zinc-500 text-xs"></i>
                <input type="text" id="filter-search" placeholder="Search ref, counterparty, category, flag reason..." 
                    class="w-full pl-9 pr-3 py-2 text-xs rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 placeholder-slate-400 dark:placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
            </div>
        </div>

        <!-- Direction Filter -->
        <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-zinc-400 mb-1">Direction</label>
            <select id="filter-direction" class="w-full py-2 px-3 text-xs rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                <option value="">All Directions (IN & OUT)</option>
                <option value="IN">IN (Credits only)</option>
                <option value="OUT">OUT (Debits only)</option>
            </select>
        </div>

        <!-- Risk Level Filter -->
        <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-zinc-400 mb-1">Risk Severity</label>
            <select id="filter-risk" class="w-full py-2 px-3 text-xs rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                <option value="">All Risk Ratings</option>
                <option value="High">High Risk (&gt;75)</option>
                <option value="Medium">Medium Risk (35-75)</option>
                <option value="Low">Low Risk (&lt;35)</option>
            </select>
        </div>

        <!-- Status Filter -->
        <div>
            <label class="block text-xs font-semibold text-slate-600 dark:text-zinc-400 mb-1">Investigation Status</label>
            <select id="filter-status" class="w-full py-2 px-3 text-xs rounded-lg border border-slate-300 dark:border-zinc-700 bg-white dark:bg-zinc-950 text-slate-900 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
                <option value="">All Statuses</option>
                <option value="Escalated">Escalated</option>
                <option value="Flagged">Flagged</option>
                <option value="Under Review">Under Review</option>
                <option value="Cleared">Cleared</option>
            </select>
        </div>

        <c-slot name="summary">
            <span id="selected-count-badge" class="font-medium text-slate-700 dark:text-zinc-300 bg-slate-100 dark:bg-zinc-800 px-2.5 py-1 rounded">0 records selected</span>
            <span id="filtered-count-badge" class="text-slate-500 dark:text-zinc-400">Showing all records</span>
        </c-slot>

        <c-slot name="actions">
            <button id="btn-select-all" class="text-sky-600 dark:text-sky-400 hover:text-sky-800 dark:hover:text-sky-300 font-medium">Select All</button>
            <span>&bull;</span>
            <button id="btn-deselect-all" class="text-slate-500 dark:text-zinc-400 hover:text-slate-700 dark:hover:text-zinc-200 font-medium">Deselect All</button>
        </c-slot>
    </c-filter_bar>

    <!-- Tabulator Grid Card -->
    <c-card title="Forensic Audit Ledger" subtitle="Click any row to inspect transaction forensic details" icon="fa-solid fa-table-list" icon_color="text-sky-600 dark:text-sky-400">
        <c-slot name="actions">
            <span class="text-xs bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300 px-2.5 py-1 rounded-full font-mono">Live Grid Engine</span>
        </c-slot>

        <!-- Tabulator Table Target -->
        <div id="forensic-tabulator-table" class="w-full"></div>
    </c-card>

    <!-- Forensic Detail Modal Component -->
    <c-modal id="detail-modal" title="Transaction Forensic Dossier" subtitle="Detailed audit view" icon="fa-solid fa-shield-halved">
        <div class="space-y-3 text-sm">
            <div class="p-3 bg-slate-50 dark:bg-zinc-950 rounded-xl border border-slate-200 dark:border-zinc-800 flex justify-between">
                <span class="text-xs font-semibold text-slate-500 dark:text-zinc-400 uppercase">Counterparty</span>
                <span class="font-bold text-slate-800 dark:text-white" id="modal-party">-</span>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div class="p-3 bg-slate-50 dark:bg-zinc-950 rounded-xl border border-slate-200 dark:border-zinc-800">
                    <span class="text-xs font-semibold text-slate-500 dark:text-zinc-400 uppercase block mb-1">Account Mask</span>
                    <span class="font-mono text-xs font-semibold text-slate-800 dark:text-zinc-200" id="modal-account">-</span>
                </div>
                <div class="p-3 bg-slate-50 dark:bg-zinc-950 rounded-xl border border-slate-200 dark:border-zinc-800">
                    <span class="text-xs font-semibold text-slate-500 dark:text-zinc-400 uppercase block mb-1">Category</span>
                    <span class="text-xs font-semibold text-slate-800 dark:text-zinc-200" id="modal-category">-</span>
                </div>
            </div>
            <div class="p-3 bg-slate-50 dark:bg-zinc-950 rounded-xl border border-slate-200 dark:border-zinc-800 flex justify-between items-center">
                <span class="text-xs font-semibold text-slate-500 dark:text-zinc-400 uppercase">Transfer Amount</span>
                <span class="font-mono font-bold text-base" id="modal-amount">-</span>
            </div>
            <div class="p-3 bg-rose-50 dark:bg-rose-950/30 rounded-xl border border-rose-200 dark:border-rose-900/50">
                <span class="text-xs font-bold text-rose-700 dark:text-rose-400 uppercase block mb-1">Forensic Flag Reasoning</span>
                <p class="text-xs text-rose-800 dark:text-rose-300 leading-relaxed" id="modal-reason">-</p>
            </div>
        </div>

        <c-slot name="footer">
            <button type="button" data-modal-close="detail-modal" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-zinc-300 bg-slate-100 dark:bg-zinc-800 hover:bg-slate-200 dark:hover:bg-zinc-700 rounded-lg transition">Close</button>
            <button type="button" onclick="alert('Forensic Case Docket created for ' + document.getElementById('detail-modal-title').innerText)" class="px-4 py-2 text-xs font-semibold text-white bg-slate-900 dark:bg-amber-500 dark:text-zinc-950 hover:bg-slate-800 dark:hover:bg-amber-400 rounded-lg shadow-sm transition">
                <i class="fa-solid fa-folder-plus mr-1"></i> Add to Case Dossier
            </button>
        </c-slot>
    </c-modal>

    <!-- Tabulator Table Initialization & Interactive Logic Script (Inside Layout) -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const rawData = {{ forensic_records_json|safe }};

            // Custom Formatters with Dark Mode High Contrast
            const directionFormatter = function(cell) {
                const val = cell.getValue();
                if (val === "IN") {
                    return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800/40"><i class="fa-solid fa-arrow-down mr-1"></i>IN</span>`;
                } else {
                    return `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/40"><i class="fa-solid fa-arrow-up mr-1"></i>OUT</span>`;
                }
            };

            const amountFormatter = function(cell) {
                const val = cell.getValue();
                const formatted = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Math.abs(val));
                if (val > 0) {
                    return `<span class="font-mono font-semibold text-emerald-700 dark:text-emerald-400">+${formatted}</span>`;
                } else {
                    return `<span class="font-mono font-semibold text-rose-700 dark:text-rose-400">-${formatted}</span>`;
                }
            };

            const riskScoreFormatter = function(cell) {
                const score = cell.getValue();
                let barColor = "bg-emerald-500";
                let textColor = "text-emerald-700 dark:text-emerald-400";
                if (score >= 75) {
                    barColor = "bg-rose-500";
                    textColor = "text-rose-700 dark:text-rose-400";
                } else if (score >= 35) {
                    barColor = "bg-amber-500";
                    textColor = "text-amber-700 dark:text-amber-400";
                }

                return `
                    <div class="w-full flex items-center space-x-2">
                        <div class="w-16 bg-slate-200 dark:bg-zinc-800 rounded-full h-2 overflow-hidden">
                            <div class="${barColor} h-2 rounded-full" style="width: ${score}%"></div>
                        </div>
                        <span class="font-mono text-xs font-bold ${textColor}">${score}</span>
                    </div>
                `;
            };

            const statusFormatter = function(cell) {
                const status = cell.getValue();
                switch(status) {
                    case "Escalated":
                        return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-100 dark:bg-rose-950/60 text-rose-800 dark:text-rose-300 border border-rose-200 dark:border-rose-800/50"><i class="fa-solid fa-triangle-exclamation mr-1 text-[10px]"></i>Escalated</span>`;
                    case "Flagged":
                        return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 border border-amber-200 dark:border-amber-800/50"><i class="fa-solid fa-flag mr-1 text-[10px]"></i>Flagged</span>`;
                    case "Under Review":
                        return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-sky-100 dark:bg-sky-950/60 text-sky-800 dark:text-sky-300 border border-sky-200 dark:border-sky-800/50"><i class="fa-solid fa-hourglass-half mr-1 text-[10px]"></i>Review</span>`;
                    default:
                        return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-slate-100 dark:bg-zinc-800 text-slate-700 dark:text-zinc-300 border border-slate-200 dark:border-zinc-700"><i class="fa-solid fa-check mr-1 text-[10px]"></i>Cleared</span>`;
                }
            };

            // Table Definition
            const table = new Tabulator("#forensic-tabulator-table", {
                data: rawData,
                layout: "fitColumns",
                responsiveLayout: "collapse",
                pagination: "local",
                paginationSize: 10,
                paginationSizeSelector: [5, 10, 25, 50],
                movableColumns: true,
                selectableRows: true,
                placeholder: "No forensic transactions match your filter criteria.",
                columns: [
                    {
                        formatter: "rowSelection", 
                        titleFormatter: "rowSelection", 
                        hozAlign: "center", 
                        headerHozAlign: "center",
                        headerSort: false, 
                        width: 45, 
                        cssClass: "cursor-pointer"
                    },
                    { title: "Ref No", field: "ref_no", width: 120, font: "mono", cssClass: "font-mono font-semibold text-slate-700 dark:text-zinc-200" },
                    { title: "Timestamp", field: "date", width: 140, cssClass: "text-slate-500 dark:text-zinc-400 font-mono text-xs" },
                    { 
                        title: "Counterparty Entity", 
                        field: "party", 
                        minWidth: 200,
                        formatter: function(cell) {
                            const row = cell.getRow().getData();
                            return `<div>
                                <div class="font-semibold text-slate-900 dark:text-zinc-100">${cell.getValue()}</div>
                                <div class="text-[11px] font-mono text-slate-400 dark:text-zinc-500">${row.account_no}</div>
                            </div>`;
                        }
                    },
                    { title: "Category", field: "category", width: 160, cssClass: "text-xs text-slate-600 dark:text-zinc-400 font-medium" },
                    { title: "Dir", field: "direction", width: 80, hozAlign: "center", headerHozAlign: "center", formatter: directionFormatter },
                    { 
                        title: "Amount (INR)", 
                        field: "amount", 
                        width: 140, 
                        hozAlign: "right", 
                        headerHozAlign: "right",
                        formatter: amountFormatter,
                        bottomCalc: "sum",
                        bottomCalcFormatter: function(cell) {
                            const val = cell.getValue();
                            const formatted = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Math.abs(val));
                            return `<span class="font-mono font-bold text-xs text-slate-900 dark:text-zinc-100">Net: ${val >= 0 ? '+' : '-'}${formatted}</span>`;
                        }
                    },
                    { title: "Risk Score", field: "risk_score", width: 130, formatter: riskScoreFormatter, hozAlign: "left" },
                    { title: "Status", field: "status", width: 130, formatter: statusFormatter, hozAlign: "center", headerHozAlign: "center" },
                ],
                rowClick: function(e, row) {
                    if (e.target.type === "checkbox") return;

                    const data = row.getData();
                    document.getElementById("detail-modal-title").innerText = data.ref_no + " (" + data.party + ")";
                    const subtitleEl = document.getElementById("detail-modal-subtitle");
                    if (subtitleEl) subtitleEl.innerText = "Recorded at: " + data.date;
                    
                    document.getElementById("modal-party").innerText = data.party;
                    document.getElementById("modal-account").innerText = data.account_no;
                    document.getElementById("modal-category").innerText = data.category;
                    
                    const formatted = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Math.abs(data.amount));
                    const amtEl = document.getElementById("modal-amount");
                    amtEl.innerText = (data.amount > 0 ? "+" : "-") + formatted;
                    amtEl.className = data.amount > 0 ? "font-mono font-bold text-base text-emerald-600 dark:text-emerald-400" : "font-mono font-bold text-base text-rose-600 dark:text-rose-400";

                    document.getElementById("modal-reason").innerText = data.flag_reason;
                    document.getElementById("detail-modal").classList.remove("hidden");
                }
            });

            // Row Selection Tracker
            table.on("rowSelectionChanged", function(data, rows) {
                document.getElementById("selected-count-badge").innerText = `${data.length} records selected`;
            });

            // Filter Logic
            function applyFilters() {
                const searchVal = document.getElementById("filter-search").value.toLowerCase();
                const directionVal = document.getElementById("filter-direction").value;
                const riskVal = document.getElementById("filter-risk").value;
                const statusVal = document.getElementById("filter-status").value;

                table.setFilter(function(data) {
                    if (searchVal) {
                        const matchSearch = 
                            (data.ref_no && data.ref_no.toLowerCase().includes(searchVal)) ||
                            (data.party && data.party.toLowerCase().includes(searchVal)) ||
                            (data.category && data.category.toLowerCase().includes(searchVal)) ||
                            (data.account_no && data.account_no.toLowerCase().includes(searchVal)) ||
                            (data.flag_reason && data.flag_reason.toLowerCase().includes(searchVal));
                        if (!matchSearch) return false;
                    }

                    if (directionVal && data.direction !== directionVal) {
                        return false;
                    }

                    if (riskVal) {
                        if (riskVal === "High" && data.risk_score < 75) return false;
                        if (riskVal === "Medium" && (data.risk_score < 35 || data.risk_score >= 75)) return false;
                        if (riskVal === "Low" && data.risk_score >= 35) return false;
                    }

                    if (statusVal && data.status !== statusVal) {
                        return false;
                    }

                    return true;
                });

                setTimeout(() => {
                    const count = table.getDataCount("active");
                    document.getElementById("filtered-count-badge").innerText = `Showing ${count} of ${rawData.length} records`;
                }, 50);
            }

            // Attach Filter Listeners
            document.getElementById("filter-search").addEventListener("input", applyFilters);
            document.getElementById("filter-direction").addEventListener("change", applyFilters);
            document.getElementById("filter-risk").addEventListener("change", applyFilters);
            document.getElementById("filter-status").addEventListener("change", applyFilters);

            // Action Buttons
            document.getElementById("btn-reset-filters").addEventListener("click", function() {
                document.getElementById("filter-search").value = "";
                document.getElementById("filter-direction").value = "";
                document.getElementById("filter-risk").value = "";
                document.getElementById("filter-status").value = "";
                table.clearFilter();
                document.getElementById("filtered-count-badge").innerText = `Showing all ${rawData.length} records`;
            });

            document.getElementById("btn-select-all").addEventListener("click", function() {
                table.selectRow("active");
            });

            document.getElementById("btn-deselect-all").addEventListener("click", function() {
                table.deselectRow();
            });

            document.getElementById("btn-export-csv").addEventListener("click", function() {
                table.download("csv", "forensic_transactions_report.csv");
            });

            document.getElementById("btn-export-json").addEventListener("click", function() {
                table.download("json", "forensic_transactions_report.json");
            });

            document.getElementById("btn-print").addEventListener("click", function() {
                table.print(false, true);
            });

            // Universal Modal Close Handlers
            document.querySelectorAll("[data-modal-close]").forEach(btn => {
                btn.addEventListener("click", function() {
                    const modalId = this.getAttribute("data-modal-close");
                    document.getElementById(modalId).classList.add("hidden");
                });
            });

            // Close modal when clicking backdrop
            document.getElementById("detail-modal").addEventListener("click", function(e) {
                if (e.target === this) {
                    this.classList.add("hidden");
                }
            });
        });
    </script>

</c-base>
